name: Android APK - pretrained Arabic alphabet
on:
  push:
    branches: [feature/arabic-sign-fusion, feature/arabic-sign-fusion-v05]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download, verify and convert pretrained model
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'tensorflow-cpu==2.15.1'
          python tools/prepare_model.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test recognition stabilization
        run: |
          mkdir -p /tmp/gate_classes
          javac -d /tmp/gate_classes app/src/main/java/org/openarabicsign/fusion/PredictionGate.java app/src/main/java/org/openarabicsign/fusion/ClassScores.java tools/TestGate.java
          java -cp /tmp/gate_classes TestGate
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArabicSignFusion-v05-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
